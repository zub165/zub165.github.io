<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/adhan/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Adhan App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Adhan App</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Paywall only on public GitHub Pages — local/dev (localhost) stays open for testing.
    (function () {
      var host = location.hostname || '';
      var isPublic = host === 'zub165.github.io' || host.endsWith('.github.io');
      if (!isPublic) return;
      var KEY = 'adhan_web_paid_v1';
      try {
        if (localStorage.getItem(KEY) === '1') return;
      } catch (e) {}
      var pay = '/adhan/pay.html';
      var next = location.pathname + location.search + location.hash;
      location.replace(pay + '?next=' + encodeURIComponent(next));
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
